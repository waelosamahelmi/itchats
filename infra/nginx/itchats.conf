server {
    listen 80;
    server_name itchats.ai www.itchats.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name itchats.ai www.itchats.ai;

    ssl_certificate /etc/letsencrypt/live/itchats.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itchats.ai/privkey.pem;

    # PWA static files
    location / {
        proxy_pass http://localhost:3090;
        client_max_body_size 50m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API
    location /v1/ {
        proxy_pass http://localhost:3092;
        client_max_body_size 50m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass http://localhost:3092;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # CDN / static media
    location /media/ {
        proxy_pass http://localhost:9000;
        proxy_set_header Host $host;
    }

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
}
